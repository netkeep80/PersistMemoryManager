name: Regenerate issue 404 single header

on:
  push:
    branches:
      - agent/issue-404-pmap-relocation

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-404-pmap-relocation
          fetch-depth: 0
      - name: Install quom
        run: pip install quom
      - name: Regenerate canonical single header
        run: bash scripts/generate-single-headers.sh
      - name: Commit generated output and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regen-issue404-single-header.yml
          git add single_include/pmm/pmm.h
          git diff --cached --check
          git commit -m "chore: regenerate single header after issue 404 portability fix"
          git push origin HEAD:agent/issue-404-pmap-relocation
