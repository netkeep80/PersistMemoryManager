name: Temporary regenerate issue 398 single header

on:
  push:
    branches:
      - agent/issue-398-expand-used-size
    paths:
      - ".github/workflows/tmp-regenerate-issue398.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install quom
        run: pip install quom
      - name: Regenerate canonical single headers
        run: bash scripts/generate-single-headers.sh
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add single_include/pmm/*.h
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate single-header after expansion fix"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
