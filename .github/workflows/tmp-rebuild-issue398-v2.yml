name: Temporary rebuild issue 398 v2

on:
  push:
    branches:
      - agent/issue-398-expand-used-size-v2
    paths:
      - ".github/workflows/tmp-rebuild-issue398-v2.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical issue 398 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          layout = Path('include/pmm/layout.h')
          text = layout.read_text()
          old = '''            hdr->block_count++;
            hdr->free_count++;
            hdr->total_size = new_size;'''
          new = '''            hdr->block_count++;
            hdr->free_count++;
            hdr->used_size += ManagerAccess::kBlockHdrGranules;
            hdr->total_size = new_size;'''
          if old not in text:
              raise SystemExit('layout insertion point not found')
          layout.write_text(text.replace(old, new, 1))

          test = Path('tests/test_allocate.cpp')
          text = test.read_text()
          marker = 'TEST_CASE( "allocate_write_read", "[test_allocate]" )\n'
          if marker not in text:
              raise SystemExit('test insertion point not found')
          regression = r'''TEST_CASE( "allocate_auto_expand_after_allocated_tail_keeps_counters_consistent", "[test_allocate][issue398]" )
{
    using MgrExpand = pmm::PersistMemoryManager<pmm::CacheManagerConfig, 503>;
    using AT = MgrExpand::address_traits;
    using State = pmm::BlockStateBase<AT>;

    REQUIRE( MgrExpand::create( 8 * 1024 ) );
    auto first = MgrExpand::allocate_typed<std::uint8_t>();
    REQUIRE( !first.is_null() );

    constexpr auto kHdrGranules = pmm::detail::kBlockHeaderGranules_t<AT>;
    auto* first_blk = pmm::detail::resolve_granule_ptr<AT>(
        MgrExpand::backend().base_ptr(), static_cast<MgrExpand::index_type>( first.offset() - kHdrGranules ) );
    REQUIRE( first_blk != nullptr );

    const auto tail_idx = State::get_next_offset( first_blk );
    REQUIRE( tail_idx != AT::no_block );
    auto* tail_blk = pmm::detail::resolve_granule_ptr<AT>( MgrExpand::backend().base_ptr(), tail_idx );
    REQUIRE( tail_blk != nullptr );
    REQUIRE( pmm::is_free( State::get_node_type( tail_blk ) ) );
    const auto tail_total = State::get_weight( tail_blk );
    REQUIRE( tail_total > kHdrGranules );

    const auto tail_bytes = static_cast<std::size_t>( tail_total - kHdrGranules ) * AT::granule_size;
    auto fill_tail = MgrExpand::allocate_typed<std::uint8_t>( tail_bytes );
    REQUIRE( !fill_tail.is_null() );
    REQUIRE( fill_tail.offset() == tail_idx + kHdrGranules );

    const std::size_t before_expand = MgrExpand::total_size();
    auto after_expand = MgrExpand::allocate_typed<std::uint8_t>();
    REQUIRE( !after_expand.is_null() );
    REQUIRE( MgrExpand::total_size() > before_expand );
    REQUIRE( MgrExpand::verify().ok );

    MgrExpand::deallocate_typed( first );
    MgrExpand::deallocate_typed( fill_tail );
    MgrExpand::deallocate_typed( after_expand );
    MgrExpand::destroy();
}

'''
          test.write_text(text.replace(marker, regression + marker, 1))

          Path('changelog.d/20260808_130000_expand_used_size.md').write_text('''---\nbump: patch\n---\n\n### Fixed\n- Keep `used_size` consistent when arena growth appends a new free block after an allocated physical tail.\n''')
          PY
      - name: Install formatting and amalgamation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format
          pip install quom
      - name: Format regression
        run: clang-format -i tests/test_allocate.cpp
      - name: Regenerate canonical single headers
        run: bash scripts/generate-single-headers.sh
      - name: Commit canonical changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add include/pmm/layout.h tests/test_allocate.cpp changelog.d/20260808_130000_expand_used_size.md single_include/pmm/*.h
          git commit -m "fix: account expansion block header in used_size"
          git push origin HEAD:${GITHUB_REF_NAME}
