name: CI

on:
  push:
    branches:
      - agent/helper-405-generate-single-header

permissions:
  contents: write

jobs:
  sync-generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register embedded-container regression
        run: |
          grep -q 'test_issue403_embedded_containers' tests/CMakeLists.txt || \
            printf '\n# Issue 403: embedded pstring/parray owners survive arena relocation\npmm_add_test(test_issue403_embedded_containers test_issue403_embedded_containers.cpp)\n' >> tests/CMakeLists.txt

      - name: Install quom
        run: pip install quom

      - name: Regenerate single headers
        run: bash scripts/generate-single-headers.sh

      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- single_include/pmm tests/CMakeLists.txt; then
            echo "generated artifacts already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add single_include/pmm tests/CMakeLists.txt
          git commit -m "Regenerate issue 403 test and single-header artifacts"
          git push
