name: CI

on:
  push:
    branches:
      - agent/helper-405-generate-single-header

permissions:
  contents: write

jobs:
  sync-single-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install quom
        run: pip install quom

      - name: Regenerate single headers
        run: bash scripts/generate-single-headers.sh

      - name: Commit generated headers
        run: |
          if git diff --quiet -- single_include/pmm; then
            echo "single headers already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add single_include/pmm
          git commit -m "Regenerate single headers for issue 403"
          git push
