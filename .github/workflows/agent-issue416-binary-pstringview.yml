name: Agent issue416 binary pstringview

on:
  pull_request:
    branches:
      - agent/issue-410-inline-forest-domain-v3
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  migrate-build-and-regenerate:
    if: github.event.pull_request.head.ref == 'agent/issue-416-binary-pstringview' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-416-binary-pstringview
          fetch-depth: 0

      - name: Apply binary interning and migrate consumers
        run: python .github/agent_issue416_binary_pstringview.py

      - name: Format changed tests only
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          files=$(git diff --name-only origin/agent/issue-410-inline-forest-domain-v3 -- 'tests/*.cpp')
          if [ -n "$files" ]; then
            clang-format -i $files
          fi

      - name: Regenerate canonical single header
        shell: bash
        run: |
          pip install quom
          bash scripts/generate-single-headers.sh

      - name: Enforce manager and generated LOC budgets
        shell: bash
        run: |
          test "$(wc -l < include/pmm/persist_memory_manager.h)" -lt 1250
          baseline=$(cat scripts/source-loc-baseline.txt)
          actual=$(wc -l < single_include/pmm/pmm.h)
          echo "Single-header LOC baseline: $baseline, generated: $actual"
          test "$actual" -le "$baseline"

      - name: Reject legacy pstringview constructor consumers
        shell: bash
        run: |
          ! git grep -nE '::pstringview[[:space:]]*\(' -- tests examples demo benchmarks include ':!include/pmm/pstringview.h' ':!single_include/**'

      - name: Enforce canonical kernel formatting
        shell: bash
        run: |
          clang-format --dry-run --Werror include/pmm/pstringview.h include/pmm/persist_memory_manager.h

      - name: Enforce anchors and requirement traceability
        shell: bash
        run: |
          bash scripts/check-include-anchor-comments.sh
          python3 scripts/check-requirements-traceability.py
          python3 scripts/check-requirements-catalog.py
          bash scripts/check-docs-consistency.sh
          git diff --check

      - name: Build all consumers
        shell: bash
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON -DPMM_BUILD_DEMO=OFF -DPMM_BUILD_EXAMPLES=OFF -DPMM_BUILD_BENCHMARKS=OFF
          cmake --build build -j2

      - name: Run pstringview/object focused regressions
        shell: bash
        run: |
          ctest --test-dir build -R '^(test_issue151_pstringview|test_issue153_pmap|test_issue241_bootstrap|test_issue258_reload|test_issue258_property|test_issue312_access_modes|test_forest_registry|test_issue410_forest_registry_relocation|test_issue416_pstringview_binary)$' --output-on-failure

      - name: Remove one-shot machinery and push canonical result
        shell: bash
        run: |
          rm -f .github/workflows/agent-issue416-binary-pstringview.yml
          rm -f .github/agent_issue416_binary_pstringview.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: make pstringview binary-safe and length-aware'
          git push origin HEAD:agent/issue-416-binary-pstringview
