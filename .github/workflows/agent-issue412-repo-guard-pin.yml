name: Agent issue412 repo-guard pin v2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  update-pin-and-validate:
    if: github.event.pull_request.head.ref == 'agent/issue-412-repo-guard-current-base-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-412-repo-guard-current-base-v2
          fetch-depth: 0

      - name: Apply exact repo-guard pin migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "b1b6756639092bbd4ff6a473aeaa637a63475a86"
          new = "629c4af3f741f2514ef06bab90b226a1698499a2"

          workflow = Path(".github/workflows/repo-guard.yml")
          text = workflow.read_text()
          needle = f"uses: netkeep80/repo-guard@{old}"
          replacement = f"uses: netkeep80/repo-guard@{new}"
          if text.count(needle) != 1 or replacement in text:
              raise SystemExit("unexpected reusable Action pin state")
          workflow.write_text(text.replace(needle, replacement))

          validator = Path("scripts/check-repo-guard-rollout.sh")
          text = validator.read_text()
          expected_old = f'expected_action_ref = "{old}"'
          expected_new = f'expected_action_ref = "{new}"'
          if text.count(expected_old) != 1 or expected_new in text:
              raise SystemExit("unexpected expected_action_ref state")
          text = text.replace(expected_old, expected_new)

          old_set_anchor = 'old_action_refs = {\n    "7ab5ca2f2d9859b4ffa2c423f05e951d4971be84",'
          new_set_anchor = f'old_action_refs = {{\n    "{old}",\n    "7ab5ca2f2d9859b4ffa2c423f05e951d4971be84",'
          if text.count(old_set_anchor) != 1 or f'old_action_refs = {{\n    "{old}",' in text:
              raise SystemExit("unexpected old_action_refs state")
          validator.write_text(text.replace(old_set_anchor, new_set_anchor))
          PY

      - name: Validate rollout wiring
        run: bash scripts/check-repo-guard-rollout.sh

      - name: Remove helper and push canonical result
        shell: bash
        run: |
          rm -f .github/workflows/agent-issue412-repo-guard-pin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: consume repo-guard current-base fix'
          git push origin HEAD:agent/issue-412-repo-guard-current-base-v2
