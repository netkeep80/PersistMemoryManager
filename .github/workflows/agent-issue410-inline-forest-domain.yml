name: Agent issue410 forest registry compaction

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  inline-fix-and-test:
    if: github.event.pull_request.head.ref == 'agent/issue-410-inline-forest-domain' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-410-inline-forest-domain
          fetch-depth: 0

      - name: Inline legacy shard and apply asserted relocation fixes
        run: python .github/agent_issue410_patch.py

      - name: Format and structural checks
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format -i tests/test_issue410_forest_registry_relocation.cpp
          test "$(wc -l < include/pmm/persist_memory_manager.h)" -lt 1500
          ! test -e include/pmm/forest_domain_mixin.inc
          ! grep -q 'forest_domain_mixin.inc' include/pmm/persist_memory_manager.h
          clang-format --dry-run --Werror include/pmm/persist_memory_manager.h

      - name: Build and run focused regression
        shell: bash
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON -DPMM_BUILD_DEMO=OFF -DPMM_BUILD_EXAMPLES=OFF -DPMM_BUILD_BENCHMARKS=OFF
          cmake --build build --target test_issue410_forest_registry_relocation -j2
          ctest --test-dir build -R '^test_issue410_forest_registry_relocation$' --output-on-failure

      - name: Remove one-shot machinery and push result
        shell: bash
        run: |
          rm .github/workflows/agent-issue410-inline-forest-domain.yml
          rm .github/agent_issue410_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: inline and harden forest registry implementation'
          git push origin HEAD:agent/issue-410-inline-forest-domain
