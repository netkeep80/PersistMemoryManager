name: Agent issue426 typed handle identity

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  identity-version-regenerate-test:
    if: github.event.pull_request.head.ref == 'agent/issue-426-typed-handle-identity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-426-typed-handle-identity
          fetch-depth: 0

      - name: Apply typed-handle identity and image-v3 migration
        run: python .github/agent_issue426_typed_identity.py

      - name: Format changed product and tests
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format -i include/pmm/pmap.h include/pmm/types.h tests/test_issue329_image_version.cpp tests/test_issue426_pmap_type_identity.cpp

      - name: Keep typed identity LOC-neutral
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("include/pmm/pmap.h")
          text = path.read_text()
          start = text.index("template <typename T> inline constexpr const char* pmap_pptr_tag_v = nullptr;")
          end = text.index("inline uint64_t pmap_key_hash", start)
          compact = r'''// clang-format off
          template <typename T> inline constexpr const char* pmap_pptr_tag_v = nullptr;
          template <typename Pointee, typename ManagerT> inline constexpr const char* pmap_pptr_tag_v<pptr<Pointee, ManagerT>> = pmap_type_identity<Pointee>::tag;
          template <typename T> inline constexpr bool pmap_has_stable_identity_v = pmap_pptr_tag_v<T> == nullptr || pmap_pptr_tag_v<T>[0] != '\0';
          constexpr uint32_t pmap_fnv1a( uint32_t h, uint64_t v, unsigned bytes ) noexcept { for ( unsigned i = 0; i < bytes; ++i, v >>= 8 ) h = ( h ^ static_cast<uint8_t>( v & 0xffull ) ) * 16777619u; return h; }
          template <typename T> constexpr uint32_t pmap_type_fp() noexcept
          {
              constexpr const char* tag = pmap_pptr_tag_v<T>;
              if constexpr ( tag != nullptr ) { static_assert( pmap_has_stable_identity_v<T>, "pmap typed handle requires stable pointee identity" ); uint32_t h = 0x749ed278u; for ( const char* t = tag; *t != '\0'; ++t ) h = pmap_fnv1a( h, static_cast<uint8_t>( *t ), 1 ); return h; }
              const uint64_t traits = ( uint64_t{ std::is_integral_v<T> } << 0 ) | ( uint64_t{ std::is_floating_point_v<T> } << 1 ) | ( uint64_t{ std::is_signed_v<T> } << 2 ) | ( uint64_t{ std::is_unsigned_v<T> } << 3 ) | ( uint64_t{ std::is_pointer_v<T> } << 4 ) | ( uint64_t{ std::is_class_v<T> } << 5 ) | ( uint64_t{ std::is_enum_v<T> } << 6 ) | ( uint64_t{ std::is_trivially_copyable_v<T> } << 7 ) | ( uint64_t{ std::is_standard_layout_v<T> } << 8 );
              uint32_t h = 2166136261u; h = pmap_fnv1a( h, sizeof( T ), 8 ); h = pmap_fnv1a( h, alignof( T ), 8 ); h = pmap_fnv1a( h, traits, 8 );
              for ( const char* t = pmm::pmap_type_identity<T>::tag; t != nullptr && *t != '\0'; ++t ) h = pmap_fnv1a( h, static_cast<uint8_t>( *t ), 1 );
              return h;
          }
          // clang-format on
          '''
          path.write_text(text[:start] + compact + text[end:])
          PY

      - name: Regenerate canonical single header
        shell: bash
        run: |
          pip install quom
          bash scripts/generate-single-headers.sh

      - name: Enforce manager and generated LOC budgets
        shell: bash
        run: |
          test "$(wc -l < include/pmm/persist_memory_manager.h)" -lt 1250
          baseline=$(cat scripts/source-loc-baseline.txt)
          actual=$(wc -l < single_include/pmm/pmm.h)
          echo "Single-header LOC baseline: $baseline, generated: $actual"
          test "$actual" -le "$baseline"

      - name: Enforce canonical pmap and version formatting
        shell: bash
        run: |
          clang-format --dry-run --Werror include/pmm/pmap.h include/pmm/types.h

      - name: Reject compiler-specific persistent identity
        shell: bash
        run: |
          ! git grep -nE '__PRETTY_FUNCTION__|__FUNCSIG__|typeid\(' -- include/pmm/pmap.h

      - name: Enforce anchors and requirement traceability
        shell: bash
        run: |
          bash scripts/check-include-anchor-comments.sh
          python3 scripts/check-requirements-traceability.py
          python3 scripts/check-requirements-catalog.py
          bash scripts/check-docs-consistency.sh
          git diff --check

      - name: Build identity and compatibility regressions
        shell: bash
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON -DPMM_BUILD_DEMO=OFF -DPMM_BUILD_EXAMPLES=OFF -DPMM_BUILD_BENCHMARKS=OFF
          cmake --build build --target test_issue329_image_version test_issue153_pmap test_issue404_pmap_relocation test_issue426_pmap_type_identity -j2

      - name: Run identity, pmap and version regressions
        shell: bash
        run: |
          ctest --test-dir build -R '^(test_issue329_image_version|test_issue153_pmap|test_issue404_pmap_relocation|test_issue426_pmap_type_identity)$' --output-on-failure

      - name: Remove one-shot machinery and push canonical result
        shell: bash
        run: |
          rm -f .github/workflows/agent-issue426-typed-handle-identity.yml
          rm -f .github/agent_issue426_typed_identity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: make pmap typed-handle identity collision-safe'
          git push origin HEAD:agent/issue-426-typed-handle-identity
