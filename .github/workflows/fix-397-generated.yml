name: One-shot issue 396 integration

permissions:
  contents: write

on:
  push:
    branches:
      - agent/issue-396-binary-safe-pstring
    paths:
      - .github/workflows/fix-397-generated.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-396-binary-safe-pstring
          fetch-depth: 0
      - name: Register focused regression test
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/CMakeLists.txt')
          text = path.read_text()
          old = 'pmm_add_test(test_issue45_pstring test_issue45_pstring.cpp)'
          new = old + '\n\n# Issue 396: binary-safe, length-aware pstring regressions\npmm_add_test(test_issue396_binary_pstring test_issue396_binary_pstring.cpp)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one pstring test registration, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Regenerate canonical single header
        run: |
          python -m pip install quom
          bash scripts/generate-single-headers.sh
      - name: Commit clean result and remove helper
        run: |
          rm .github/workflows/fix-397-generated.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/CMakeLists.txt single_include/pmm/pmm.h .github/workflows/fix-397-generated.yml
          git diff --cached --check
          git commit -m "Integrate binary-safe pstring regressions"
          git push origin HEAD:agent/issue-396-binary-safe-pstring
