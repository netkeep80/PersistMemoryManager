name: Agent regenerate PMM single headers

on:
  push:
    branches:
      - agent/issue-392-application-node-types

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-392-application-node-types

      - name: Install generator
        run: pip install quom

      - name: Regenerate canonical single-header artifacts
        run: bash scripts/generate-single-headers.sh

      - name: Commit generated artifacts and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add single_include/pmm
          git rm .github/workflows/agent-generate-single-headers.yml
          git commit -m "build: regenerate single headers for application NodeType"
          git push origin HEAD:agent/issue-392-application-node-types
