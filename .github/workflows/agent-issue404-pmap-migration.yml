name: Agent issue404 pmap migration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  migrate-and-generate:
    if: github.event.pull_request.head.ref == 'agent/issue-404-pmap-relocation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-404-pmap-relocation
          fetch-depth: 0

      - name: Migrate pmap API consumers and register regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_issue153_pmap.cpp')
          text = path.read_text()
          replacements = [
              (
                  '    TestMgr::pmap<int, int>                                 named_a( "issue336/shared" );',
                  '    TestMgr::pmap<int, int>                                 named_a;\n'
                  '    REQUIRE( named_a.bind_domain( "issue336/shared" ) );',
              ),
              (
                  '    TestMgr::pmap<TestMgr::pptr<TestMgr::pstringview>, int> named_s( "issue336/shared" );',
                  '    TestMgr::pmap<TestMgr::pptr<TestMgr::pstringview>, int> named_s;\n'
                  '    REQUIRE( named_s.bind_domain( "issue336/shared" ) );',
              ),
              (
                  '    TestMgr::pmap<int, int> named_b( "issue336/shared" );',
                  '    TestMgr::pmap<int, int> named_b;\n'
                  '    REQUIRE( named_b.bind_domain( "issue336/shared" ) );',
              ),
              (
                  '    TestMgr::pmap<int, Issue336TagA> ta( "issue336/stable" );',
                  '    TestMgr::pmap<int, Issue336TagA> ta;\n'
                  '    REQUIRE( ta.bind_domain( "issue336/stable" ) );',
              ),
              (
                  '    TestMgr::pmap<int, Issue336TagB> tb( "issue336/stable" );',
                  '    TestMgr::pmap<int, Issue336TagB> tb;\n'
                  '    REQUIRE( tb.bind_domain( "issue336/stable" ) );',
              ),
              (
                  '    TestMgr::pmap<int, Issue336TagA> ta2( "issue336/stable" );',
                  '    TestMgr::pmap<int, Issue336TagA> ta2;\n'
                  '    REQUIRE( ta2.bind_domain( "issue336/stable" ) );',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence, got {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text)

          regression = Path('tests/test_issue404_pmap_relocation.cpp')
          rtext = regression.read_text()
          old_include = '#include <cstring>\n#include <type_traits>'
          if rtext.count(old_include) != 1:
              raise SystemExit('unexpected regression include layout')
          regression.write_text(rtext.replace(old_include, '#include <cstring>\n#include <string_view>\n#include <type_traits>'))

          cmake = Path('tests/CMakeLists.txt')
          ctext = cmake.read_text()
          line = 'pmm_add_test(test_issue404_pmap_relocation test_issue404_pmap_relocation.cpp)'
          if line in ctext:
              raise SystemExit('issue404 regression already registered')
          marker = 'pmm_add_test(test_issue403_embedded_containers test_issue403_embedded_containers.cpp)'
          if ctext.count(marker) != 1:
              raise SystemExit('unexpected issue403 registration marker')
          cmake.write_text(ctext.replace(marker, marker + '\n\n# Issue 404: pmap owners and PMM-backed inputs survive arena relocation\n' + line))
          PY

      - name: Install canonical single-header generator
        run: python -m pip install 'quom>=4,<5'

      - name: Regenerate single headers
        run: ./scripts/generate-single-headers.sh

      - name: Remove one-shot workflow and push result
        shell: bash
        run: |
          rm .github/workflows/agent-issue404-pmap-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: migrate pmap binding consumers and regenerate header'
          git push origin HEAD:agent/issue-404-pmap-relocation
